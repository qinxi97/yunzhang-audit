<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>联系咨询 · 云账审计</title>
  <meta name="description" content="提交团队规模、云厂商与月账单量级。无需原始账单，提供账单结构即可。">
  <meta name="theme-color" content="#f7f6f3">
  <link rel="stylesheet" href="style.css">
  <!--
    上线前替换：
    1. FORMSPREE_ENDPOINT → https://formspree.io/f/表单 ID
    2. wechat-qr.png → 微信二维码
  -->
</head>
<body>
  <a class="skip" href="#content">跳到正文</a>

  <header class="site-header">
    <div class="wrap nav">
      <a class="brand" href="index.html">云账审计</a>
      <nav aria-label="页面">
        <ul class="nav-links">
          <li><a href="process.html">真实案例</a></li>
          <li><a href="services.html">服务形式</a></li>
          <li><a class="nav-cta" href="contact.html" aria-current="page">联系咨询</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main id="content">
    <section class="wrap page-top" aria-labelledby="contact-title">
      <h2 id="contact-title">提交诊断需求</h2>
      <p class="lead">请填写以下信息。将在 1 至 2 个工作日内以邮件回复。无需提供原始账单，提供账单结构即可。</p>

      <form id="lead" action="FORMSPREE_ENDPOINT" method="POST" accept-charset="UTF-8">
        <input type="hidden" name="_subject" value="云账审计：新的账单诊断请求">
        <input type="hidden" name="_next" value="">
        <div class="hp" aria-hidden="true">
          <label>不要填写 <input type="text" name="_gotcha" tabindex="-1" autocomplete="off"></label>
        </div>

        <div class="field">
          <label for="name">称呼 <span class="mark">可选</span></label>
          <input id="name" name="称呼" type="text" autocomplete="name" placeholder="请输入称呼">
        </div>

        <div class="field">
          <label for="email">邮箱 <span class="req" aria-hidden="true">*</span></label>
          <input id="email" name="email" type="email" autocomplete="email" placeholder="请输入邮箱" required>
        </div>

        <div class="field">
          <label for="size">团队规模 <span class="req" aria-hidden="true">*</span></label>
          <select id="size" name="团队规模" required>
            <option value="" selected disabled>请选择</option>
            <option>1-10 人</option>
            <option>11-50 人</option>
            <option>51-200 人</option>
            <option>200 人以上</option>
          </select>
        </div>

        <div class="field">
          <label for="cloud">主要云厂商 <span class="req" aria-hidden="true">*</span></label>
          <select id="cloud" name="云厂商" required>
            <option value="" selected disabled>请选择</option>
            <option>阿里云</option>
            <option>腾讯云</option>
            <option>华为云</option>
            <option>AWS</option>
            <option>Azure</option>
            <option>多云</option>
            <option>其他</option>
          </select>
        </div>

        <div class="field">
          <label for="bill">月云账单大致量级 <span class="req" aria-hidden="true">*</span></label>
          <select id="bill" name="月账单量级" required>
            <option value="" selected disabled>请选择</option>
            <option>1 万以下</option>
            <option>1-5 万</option>
            <option>5-20 万</option>
            <option>20 万以上</option>
            <option>不确定</option>
          </select>
        </div>

        <div class="field">
          <label for="note">简要描述当前的成本问题 <span class="mark">可选</span></label>
          <textarea id="note" name="问题" maxlength="200" rows="3" placeholder="请简要描述当前的成本问题"></textarea>
          <p class="fine" id="count-hint">最多 200 字</p>
        </div>

        <p class="fine" id="form-warn" hidden>表单尚未接通，暂时无法提交。</p>

        <div class="form-actions">
          <button class="btn" type="submit">提交</button>
        </div>
      </form>
    </section>
  </main>

  <footer class="wrap site-footer">
    <p>© 2024 云账审计. 保留所有权利。</p>
  </footer>

  <aside class="wx-float" aria-label="微信">
    <div class="wx-qr">
      <img src="wechat-qr.png" width="120" height="120" alt="微信二维码">
    </div>
    <button class="wx-tab" type="button">
      <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
        <path fill="currentColor" d="M9.5 4C5.91 4 3 6.46 3 9.5c0 1.74.95 3.28 2.42 4.28L4.9 16.4l2.55-1.28c.64.18 1.33.28 2.05.28.28 0 .55-.02.82-.05-.18-.52-.28-1.08-.28-1.66 0-3.16 2.96-5.72 6.62-5.72.24 0 .47.02.7.04C16.5 5.48 13.28 4 9.5 4zm-2.05 4.15a.95.95 0 1 1 0 1.9.95.95 0 0 1 0-1.9zm4.15 0a.95.95 0 1 1 0 1.9.95.95 0 0 1 0-1.9zM16.66 9.1c-3.08 0-5.58 2.14-5.58 4.78 0 2.64 2.5 4.78 5.58 4.78.55 0 1.08-.07 1.58-.19l1.95.98-.48-1.62c1.18-.9 1.93-2.22 1.93-3.95 0-2.64-2.5-4.78-5.58-4.78zm-1.85 3.55a.75.75 0 1 1 0 1.5.75.75 0 0 1 0-1.5zm3.7 0a.75.75 0 1 1 0 1.5.75.75 0 0 1 0-1.5z"/>
      </svg>
      <span>微信</span>
    </button>
  </aside>

  <script>
    (function () {
      var form = document.getElementById("lead");
      var note = document.getElementById("note");
      var hint = document.getElementById("count-hint");

      function setNext() {
        var next = form.querySelector('input[name="_next"]');
        if (next) next.value = new URL("thanks.html", window.location.href).href;
      }

      if (form) {
        setNext();
        form.addEventListener("submit", function (event) {
          setNext();
          if (form.getAttribute("action") === "FORMSPREE_ENDPOINT") {
            event.preventDefault();
            var warn = document.getElementById("form-warn");
            if (warn) warn.hidden = false;
          }
        });
      }

      if (note && hint) {
        note.addEventListener("input", function () {
          hint.textContent = note.value.length + " / 200";
        });
      }
    })();
  </script>
</body>
</html>
